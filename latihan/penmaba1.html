<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Penmaba UNJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .correct-answer {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }
        .wrong-answer {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        .disabled-option {
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <header class="bg-green-700 text-white p-4 shadow-md flex-none">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold">Simulasi Penmaba UNJ</h1>
            <div id="score-display" class="hidden text-sm bg-green-800 px-3 py-1 rounded-full">
                Skor: <span id="current-score" class="font-bold">0</span> / <span id="total-answered">0</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow flex flex-col items-center justify-center relative max-w-4xl">
        
        <!-- Layar Pemilihan Kategori -->
        <div id="menu-screen" class="w-full bg-white rounded-xl shadow-lg p-6 md:p-10 text-center transition-all duration-300">
            <h2 class="text-2xl font-bold mb-2">Selamat Datang di Latihan Soal</h2>
            <p class="text-gray-600 mb-8">Pilih kategori tes yang ingin Anda kerjakan. Setiap kategori berisi 25 soal latihan.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button id="btn-skolastik" onclick="startTest('skolastik')" class="category-btn p-6 border-2 border-green-500 rounded-lg hover:bg-green-50 transition-colors flex flex-col items-center group">
                    <span class="text-3xl mb-2">🧠</span>
                    <h3 class="font-bold text-lg group-hover:text-green-700">Tes Penalaran Skolastik</h3>
                    <p id="desc-skolastik" class="text-sm text-gray-500">25 Soal</p>
                </button>
                <button id="btn-matematika" onclick="startTest('matematika')" class="category-btn p-6 border-2 border-blue-500 rounded-lg hover:bg-blue-50 transition-colors flex flex-col items-center group">
                    <span class="text-3xl mb-2">➗</span>
                    <h3 class="font-bold text-lg group-hover:text-blue-700">Penalaran Matematika</h3>
                    <p id="desc-matematika" class="text-sm text-gray-500">25 Soal</p>
                </button>
                <button id="btn-bahasa_indonesia" onclick="startTest('bahasa_indonesia')" class="category-btn p-6 border-2 border-red-500 rounded-lg hover:bg-red-50 transition-colors flex flex-col items-center group">
                    <span class="text-3xl mb-2">📖</span>
                    <h3 class="font-bold text-lg group-hover:text-red-700">Literasi Bahasa Indonesia</h3>
                    <p id="desc-bahasa_indonesia" class="text-sm text-gray-500">25 Soal</p>
                </button>
                <button id="btn-bahasa_inggris" onclick="startTest('bahasa_inggris')" class="category-btn p-6 border-2 border-purple-500 rounded-lg hover:bg-purple-50 transition-colors flex flex-col items-center group">
                    <span class="text-3xl mb-2">🔤</span>
                    <h3 class="font-bold text-lg group-hover:text-purple-700">Literasi Bahasa Inggris</h3>
                    <p id="desc-bahasa_inggris" class="text-sm text-gray-500">25 Soal</p>
                </button>
            </div>
        </div>

        <!-- Layar Pengerjaan Soal -->
        <div id="quiz-screen" class="hidden w-full bg-white rounded-xl shadow-lg p-6 md:p-8 flex flex-col transition-all duration-300">
            <div class="flex justify-between items-center mb-6 pb-4 border-b">
                <button onclick="backToMenu()" class="text-gray-500 hover:text-gray-800 flex items-center text-sm font-medium">
                    ← Kembali ke Menu
                </button>
                <div class="text-sm font-semibold px-3 py-1 bg-gray-100 rounded-full" id="question-counter">
                    Soal 1 / 25
                </div>
            </div>

            <div id="question-container" class="mb-6">
                <!-- Teks bacaan jika ada -->
                <div id="passage-text" class="hidden mb-6 p-4 bg-gray-50 rounded-lg border text-gray-700 text-sm md:text-base leading-relaxed text-justify">
                </div>
                
                <h3 id="question-text" class="text-lg md:text-xl font-semibold mb-6">Pertanyaan akan muncul di sini...</h3>
                
                <div id="options-container" class="space-y-3">
                    <!-- Opsi jawaban akan di-generate di sini -->
                </div>
            </div>

            <!-- Area Pembahasan (Awalnya disembunyikan) -->
            <div id="explanation-container" class="hidden mb-6 p-5 bg-blue-50 border border-blue-200 rounded-lg">
                <h4 class="font-bold text-blue-800 mb-2 flex items-center">
                    <span class="mr-2">💡</span> Pembahasan
                </h4>
                <p id="explanation-text" class="text-gray-700 text-sm md:text-base"></p>
            </div>

            <div class="mt-auto flex justify-end pt-4 border-t">
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-sm">
                    Soal Selanjutnya
                </button>
                <button id="finish-btn" onclick="finishTest()" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-sm">
                    Selesai
                </button>
            </div>
        </div>

        <!-- Layar Hasil Akhir -->
        <div id="result-screen" class="hidden w-full max-w-lg bg-white rounded-xl shadow-lg p-8 text-center transition-all duration-300">
            <h2 class="text-3xl font-bold mb-2">Tes Selesai!</h2>
            <p id="result-category" class="text-gray-500 mb-6 font-medium"></p>
            
            <div class="flex justify-center items-center mb-8">
                <div class="relative w-32 h-32 rounded-full border-8 border-gray-100 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path id="score-circle"
                            class="text-green-500 stroke-current"
                            stroke-width="3"
                            stroke-dasharray="100, 100"
                            fill="none"
                            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                    </svg>
                    <div class="text-3xl font-bold text-gray-800" id="final-score">0%</div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-green-50 p-4 rounded-lg border border-green-100">
                    <div class="text-green-600 text-sm font-semibold">Benar</div>
                    <div id="correct-count" class="text-2xl font-bold text-green-700">0</div>
                </div>
                <div class="bg-red-50 p-4 rounded-lg border border-red-100">
                    <div class="text-red-600 text-sm font-semibold">Salah</div>
                    <div id="wrong-count" class="text-2xl font-bold text-red-700">0</div>
                </div>
            </div>

            <button onclick="backToMenu()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                Kembali ke Menu Utama
            </button>
        </div>
    </main>

    <script>
        // Data Soal
        const questionsData = {
            skolastik: [
                {
                    q: "Semua mahasiswa baru harus mengikuti orientasi. Sebagian mahasiswa baru memakai kemeja putih. Kesimpulan yang tepat adalah...",
                    options: [
                        "A. Semua mahasiswa yang mengikuti orientasi memakai kemeja putih.",
                        "B. Sebagian mahasiswa baru yang tidak memakai kemeja putih tidak mengikuti orientasi.",
                        "C. Sebagian mahasiswa baru yang mengikuti orientasi memakai kemeja putih.",
                        "D. Semua mahasiswa baru yang memakai kemeja putih tidak mengikuti orientasi.",
                        "E. Tidak ada mahasiswa baru yang memakai kemeja putih."
                    ],
                    answer: 2,
                    explanation: "Berdasarkan premis 'Semua mahasiswa baru mengikuti orientasi' dan 'Sebagian mahasiswa baru memakai kemeja putih', maka irisan dari kedua himpunan tersebut adalah sebagian mahasiswa baru yang mengikuti orientasi dan mereka memakai kemeja putih. Jawaban C paling tepat."
                },
                {
                    q: "Jika hari ini hujan, maka Budi membawa payung. Budi tidak membawa payung. Maka kesimpulannya adalah...",
                    options: [
                        "A. Hari ini hujan.",
                        "B. Hari ini tidak hujan.",
                        "C. Budi lupa membawa payung.",
                        "D. Payung Budi rusak.",
                        "E. Budi tidak suka hujan."
                    ],
                    answer: 1,
                    explanation: "Ini adalah bentuk modus tollens logika matematika. Premis 1: p -> q (Hujan -> Bawa payung). Premis 2: ~q (Tidak bawa payung). Kesimpulan: ~p (Tidak hujan)."
                },
                {
                    q: "SINONIM dari kata 'EVOKASI' adalah...",
                    options: [
                        "A. Penilaian",
                        "B. Penggugah rasa",
                        "C. Provokasi",
                        "D. Izin menetap",
                        "E. Pengungsian"
                    ],
                    answer: 1,
                    explanation: "Menurut KBBI, evokasi berarti daya penggugah rasa; kemampuan membangkitkan kenangan, ingatan, dsb."
                },
                {
                    q: "ANTONIM dari kata 'APRIORI' adalah...",
                    options: [
                        "A. Posteriori",
                        "B. Prioritas",
                        "C. Unggulan",
                        "D. Terakhir",
                        "E. Proporsi"
                    ],
                    answer: 0,
                    explanation: "Apriori berarti pengetahuan yang ada sebelum pengalaman/pengamatan. Antonimnya adalah Posteriori yang berarti pengetahuan yang didapat dari pengalaman/setelah kejadian."
                },
                {
                    q: "Buku : Perpustakaan = Uang : ...",
                    options: [
                        "A. Dompet",
                        "B. Bank",
                        "C. Brankas",
                        "D. Kasir",
                        "E. Ekonomi"
                    ],
                    answer: 1,
                    explanation: "Analogi tempat penyimpanan institusional. Buku disimpan secara terorganisir di Perpustakaan. Uang disimpan secara terorganisir di Bank. (Dompet dan brankas lebih ke tempat penyimpanan pribadi)."
                },
                {
                    q: "Deret angka: 2, 5, 10, 17, 26, ... Angka selanjutnya adalah?",
                    options: [
                        "A. 35",
                        "B. 37",
                        "C. 39",
                        "D. 41",
                        "E. 43"
                    ],
                    answer: 1,
                    explanation: "Pola selisih: +3, +5, +7, +9. Selisih selanjutnya adalah +11. Jadi, 26 + 11 = 37."
                },
                {
                    q: "Huruf selanjutnya dari deret: A, C, F, J, O, ...",
                    options: [
                        "A. S",
                        "B. T",
                        "C. U",
                        "D. V",
                        "E. W"
                    ],
                    answer: 2,
                    explanation: "Jarak antar huruf: A ke C (+2), C ke F (+3), F ke J (+4), J ke O (+5). Maka O + 6 = U."
                },
                {
                    q: "Sebuah proyek diselesaikan oleh 8 orang dalam 15 hari. Jika proyek ingin diselesaikan dalam 10 hari, berapa banyak tambahan pekerja yang dibutuhkan?",
                    options: [
                        "A. 4 orang",
                        "B. 6 orang",
                        "C. 12 orang",
                        "D. 10 orang",
                        "E. 2 orang"
                    ],
                    answer: 0,
                    explanation: "Ini adalah perbandingan berbalik nilai. (8 orang * 15 hari) = (X orang * 10 hari). 120 = 10X -> X = 12 orang. Total pekerja butuh 12 orang. Karena sudah ada 8 orang, tambahan yang dibutuhkan adalah 12 - 8 = 4 orang."
                },
                {
                    q: "Tidak ada pemalas yang sukses. Semua yang sukses rajin bekerja. Sebagian karyawan adalah pemalas. Kesimpulan...",
                    options: [
                        "A. Sebagian karyawan sukses.",
                        "B. Sebagian karyawan tidak sukses.",
                        "C. Semua karyawan tidak sukses.",
                        "D. Semua pemalas rajin bekerja.",
                        "E. Sebagian pemalas rajin bekerja."
                    ],
                    answer: 1,
                    explanation: "Karena sebagian karyawan adalah pemalas, dan tidak ada pemalas yang sukses, maka sebagian karyawan (yang pemalas itu) pasti tidak sukses."
                },
                {
                    q: "Pilihlah kata yang TIDAK termasuk dalam kelompoknya!",
                    options: [
                        "A. Paus",
                        "B. Hiu",
                        "C. Lumba-lumba",
                        "D. Pesut",
                        "E. Anjing laut"
                    ],
                    answer: 1,
                    explanation: "Paus, lumba-lumba, pesut, dan anjing laut adalah mamalia laut (berkembang biak dengan melahirkan dan bernapas dengan paru-paru). Sedangkan hiu adalah kelompok ikan (pisces)."
                },
                {
                    q: "12, 13, 15, 18, 22, X, Y. Nilai X dan Y adalah...",
                    options: [
                        "A. 27, 33",
                        "B. 27, 34",
                        "C. 28, 34",
                        "D. 28, 35",
                        "E. 29, 36"
                    ],
                    answer: 0,
                    explanation: "Polanya adalah penambahan selisih yang bertambah 1: +1, +2, +3, +4. Selanjutnya +5 (22+5 = 27 = X), lalu +6 (27+6 = 33 = Y)."
                },
                {
                    q: "Lampu A menyala setiap 12 menit, lampu B setiap 15 menit, dan lampu C setiap 20 menit. Jika ketiganya menyala bersamaan pada pukul 08.00, pukul berapa mereka menyala bersamaan lagi?",
                    options: [
                        "A. 08.45",
                        "B. 09.00",
                        "C. 09.15",
                        "D. 09.30",
                        "E. 10.00"
                    ],
                    answer: 1,
                    explanation: "Cari KPK dari 12, 15, dan 20. KPK-nya adalah 60. Artinya mereka menyala bersamaan lagi setelah 60 menit (1 jam). 08.00 + 1 jam = 09.00."
                },
                {
                    q: "Analogi: GURU : SEKOLAH = ... : ...",
                    options: [
                        "A. Dokter : Pasien",
                        "B. Petani : Sawah",
                        "C. Hakim : Pengacara",
                        "D. Polisi : Lalu lintas",
                        "E. Koki : Makanan"
                    ],
                    answer: 1,
                    explanation: "Hubungan profesi dan tempat kerja utamanya. Guru bekerja di sekolah, Petani bekerja di sawah."
                },
                {
                    q: "Antonim dari 'PROMINEN' adalah...",
                    options: [
                        "A. Terkenal",
                        "B. Biasa",
                        "C. Elit",
                        "D. Menonjol",
                        "E. Penting"
                    ],
                    answer: 1,
                    explanation: "Prominen artinya terkemuka, menonjol, terkenal. Antonim yang tepat adalah 'Biasa' atau tidak menonjol."
                },
                {
                    q: "Sebuah kubus memiliki volume 343 cm³. Berapa luas permukaannya?",
                    options: [
                        "A. 294 cm²",
                        "B. 196 cm²",
                        "C. 216 cm²",
                        "D. 343 cm²",
                        "E. 147 cm²"
                    ],
                    answer: 0,
                    explanation: "Volume = s³. s = akar pangkat 3 dari 343 = 7 cm. Luas permukaan kubus = 6 * s² = 6 * 7² = 6 * 49 = 294 cm²."
                },
                {
                    q: "Umur ayah 4 kali umur anak. Lima tahun yang lalu, umur ayah 7 kali umur anak. Berapa umur anak sekarang?",
                    options: [
                        "A. 8 tahun",
                        "B. 10 tahun",
                        "C. 12 tahun",
                        "D. 15 tahun",
                        "E. 20 tahun"
                    ],
                    answer: 1,
                    explanation: "Misal ayah = A, anak = B. (1) A = 4B. (2) (A-5) = 7(B-5) -> A - 5 = 7B - 35. Substitusi A: 4B - 5 = 7B - 35 -> 30 = 3B -> B = 10. Umur anak sekarang adalah 10 tahun."
                },
                {
                    q: "Semua atlet rajin berlatih. Sebagian orang yang rajin berlatih memiliki tubuh atletis. Simpulan yang tepat:",
                    options: [
                        "A. Semua atlet memiliki tubuh atletis",
                        "B. Sebagian atlet tidak memiliki tubuh atletis",
                        "C. Semua orang yang memiliki tubuh atletis adalah atlet",
                        "D. Tidak dapat ditarik kesimpulan pasti",
                        "E. Sebagian atlet rajin berlatih"
                    ],
                    answer: 3,
                    explanation: "Premis tidak menghubungkan langsung atlet dengan tubuh atletis. 'Sebagian orang yang rajin berlatih' bisa jadi bukan dari kelompok 'atlet'. Oleh karena itu, hubungan pasti antara atlet dan tubuh atletis tidak dapat disimpulkan."
                },
                {
                    q: "Jika 3x + 2y = 12 dan x - y = 4, maka nilai 2x + 3y adalah...",
                    options: [
                        "A. 4",
                        "B. 6",
                        "C. 8",
                        "D. 10",
                        "E. 12"
                    ],
                    answer: 2,
                    explanation: "Dari x - y = 4 -> x = y + 4. Substitusi ke 3x + 2y = 12 -> 3(y+4) + 2y = 12 -> 3y + 12 + 2y = 12 -> 5y = 0 -> y = 0. Maka x = 0 + 4 = 4. Nilai 2x + 3y = 2(4) + 3(0) = 8."
                },
                {
                    q: "Sinonim kata 'TENDENSI' adalah...",
                    options: [
                        "A. Tegangan",
                        "B. Kecenderungan",
                        "C. Tujuan",
                        "D. Kemampuan",
                        "E. Hambatan"
                    ],
                    answer: 1,
                    explanation: "Tendensi memiliki arti kecenderungan; kecondongan (pada suatu hal)."
                },
                {
                    q: "Pilih pasangan kata yang paling sesuai! GIGIH : MENYERAH = ... : ...",
                    options: [
                        "A. Berani : Takut",
                        "B. Pintar : Cerdas",
                        "C. Rajin : Giat",
                        "D. Cepat : Lari",
                        "E. Kuat : Otot"
                    ],
                    answer: 0,
                    explanation: "Hubungan antonim (lawan kata). Gigih adalah lawan dari menyerah. Berani adalah lawan dari takut."
                },
                {
                    q: "Dalam sebuah barisan antrean, Doni berada di urutan ke-8 dari depan dan ke-15 dari belakang. Berapa total orang dalam antrean tersebut?",
                    options: [
                        "A. 21",
                        "B. 22",
                        "C. 23",
                        "D. 24",
                        "E. 25"
                    ],
                    answer: 1,
                    explanation: "Total orang = (Urutan dari depan + Urutan dari belakang) - 1. (8 + 15) - 1 = 23 - 1 = 22 orang."
                },
                {
                    q: "Jika A > B dan C < B, maka pernyataan yang pasti benar adalah...",
                    options: [
                        "A. A < C",
                        "B. A = C",
                        "C. C > A",
                        "D. A > C",
                        "E. Tidak bisa ditentukan"
                    ],
                    answer: 3,
                    explanation: "Diketahui A > B. Diketahui juga C < B, yang sama artinya dengan B > C. Disusun menjadi A > B > C. Maka A > C pasti benar."
                },
                {
                    q: "1, 2, 4, 7, 11, 16, ...",
                    options: [
                        "A. 21",
                        "B. 22",
                        "C. 23",
                        "D. 24",
                        "E. 25"
                    ],
                    answer: 1,
                    explanation: "Polanya adalah +1, +2, +3, +4, +5. Maka selanjutnya adalah +6. 16 + 6 = 22."
                },
                {
                    q: "KATA : KALIMAT = ... : ...",
                    options: [
                        "A. Huruf : Kata",
                        "B. Paragraf : Buku",
                        "C. Bab : Halaman",
                        "D. Bunyi : Suara",
                        "E. Baca : Tulis"
                    ],
                    answer: 0,
                    explanation: "Kumpulan kata menyusun kalimat. Analogi yang sejajar adalah kumpulan huruf menyusun kata."
                },
                {
                    q: "Sebuah mobil menempuh jarak 120 km dengan kecepatan 60 km/jam. Berapa lama waktu yang dibutuhkan?",
                    options: [
                        "A. 1 jam",
                        "B. 1,5 jam",
                        "C. 2 jam",
                        "D. 2,5 jam",
                        "E. 3 jam"
                    ],
                    answer: 2,
                    explanation: "Waktu = Jarak / Kecepatan. Waktu = 120 km / 60 km/jam = 2 jam."
                }
            ],

            matematika: [
                {
                    q: "Pak Budi meminjam uang di bank sebesar Rp 10.000.000 dengan bunga tunggal 12% per tahun. Jika ia mengangsur selama 15 bulan, maka besar angsuran per bulannya adalah...",
                    options: [
                        "A. Rp 666.666",
                        "B. Rp 750.000",
                        "C. Rp 766.666",
                        "D. Rp 815.000",
                        "E. Rp 850.000"
                    ],
                    answer: 2,
                    explanation: "Bunga 1 tahun (12 bulan) = 12%. Bunga 15 bulan = (15/12) * 12% = 15%. Total bunga = 15% * Rp 10.000.000 = Rp 1.500.000. Total pinjaman yang harus dikembalikan = Rp 10.000.000 + Rp 1.500.000 = Rp 11.500.000. Angsuran per bulan = Rp 11.500.000 / 15 = Rp 766.666,67."
                },
                {
                    q: "Sebuah toko pakaian memberikan diskon ganda pada akhir tahun, yaitu 20% + 10%. Jika harga awal sebuah kemeja adalah Rp 250.000, berapa harga yang harus dibayar pembeli?",
                    options: [
                        "A. Rp 175.000",
                        "B. Rp 180.000",
                        "C. Rp 190.000",
                        "D. Rp 200.000",
                        "E. Rp 225.000"
                    ],
                    answer: 1,
                    explanation: "Diskon pertama 20%: Rp 250.000 * 20% = Rp 50.000. Harga setelah diskon 1 = Rp 200.000. Diskon kedua 10% dari harga baru: Rp 200.000 * 10% = Rp 20.000. Harga akhir = Rp 200.000 - Rp 20.000 = Rp 180.000."
                },
                {
                    q: "Sebuah bak mandi berbentuk balok memiliki ukuran panjang 1,5 meter, lebar 1 meter, dan tinggi 0,8 meter. Jika bak tersebut diisi air melalui keran dengan debit 20 liter/menit, berapa lama waktu yang dibutuhkan hingga bak terisi penuh?",
                    options: [
                        "A. 1 jam",
                        "B. 1 jam 15 menit",
                        "C. 1 jam 30 menit",
                        "D. 2 jam",
                        "E. 2,5 jam"
                    ],
                    answer: 0,
                    explanation: "Volume bak = 1,5m * 1m * 0,8m = 1,2 m³ = 1200 liter. Debit = 20 liter/menit. Waktu = Volume / Debit = 1200 / 20 = 60 menit = 1 jam."
                },
                {
                    q: "Dalam sebuah kelas yang terdiri dari 40 siswa, 25 siswa menyukai matematika, 20 siswa menyukai fisika, dan 10 siswa tidak menyukai keduanya. Berapa jumlah siswa yang menyukai kedua mata pelajaran tersebut?",
                    options: [

                    passage: "Coffee is one of the most widely consumed beverages globally. Its active ingredient, caffeine, is a stimulant that can enhance alertness and reduce fatigue. Moderate coffee consumption has been associated with several health benefits, including a lower risk of Parkinson's disease, type 2 diabetes, and certain liver conditions. Nevertheless, excessive intake can lead to negative side effects such as insomnia, jitteriness, and increased heart rate. Pregnant women and individuals with specific health conditions are often advised to limit their caffeine consumption.",
                    q: "The word 'moderate' in the text means...",
                    options: [
                        "A. Extreme",
                        "B. Average or reasonable",
                        "C. Inadequate",
                        "D. Expensive",
                        "E. Daily"
                    ],
                    answer: 1,
                    explanation: "Moderate means kept or keeping within reasonable or proper limits; not extreme or excessive."
                },
                {
                    q: "If she had known you were coming, she ________ a cake.",
                    options: [
                        "A. would bake",
                        "B. will bake",
                        "C. bakes",
                        "D. would have baked",
                        "E. had baked"
                    ],
                    answer: 3,
                    explanation: "Conditional Type 3 (unreal past situation). Structure: If + Past Perfect (had known), Subject + would have + V3 (would have baked)."
                },
                {
                    q: "The meeting was called ________ because the CEO was ill.",
                    options: [
                        "A. out",
                        "B. up",
                        "C. off",
                        "D. in",
                        "E. over"
                    ],
                    answer: 2,
                    explanation: "The phrasal verb 'call off' means to cancel an event or agreement."
                },
                {
                    q: "Hardly ________ the station when the train left.",
                    options: [
                        "A. I reached",
                        "B. did I reach",
                        "C. had I reached",
                        "D. I had reached",
                        "E. was I reaching"
                    ],
                    answer: 2,
                    explanation: "When 'Hardly' starts a sentence, it requires inversion with the past perfect tense to show an action happening immediately before another in the past. Structure: Hardly + had + S + V3."
                },
                {
                    q: "He is accustomed ________ up early in the morning.",
                    options: [
                        "A. to wake",
                        "B. waking",
                        "C. to waking",
                        "D. for waking",
                        "E. wake"
                    ],
                    answer: 2,
                    explanation: "The phrase 'accustomed to' acts as a preposition, so it must be followed by a noun or a gerund (V-ing)."
                }
            ]
        };

        // State Variabel
        let currentCategory = '';
        let currentQuestionIndex = 0;
        let score = 0;
        let answeredQuestions = 0;
        let isQuestionAnswered = false;
        
        // Memuat state dari local storage (Cache)
        let appState = {};
        try {
            appState = JSON.parse(localStorage.getItem('penmabaState')) || {};
        } catch (e) {
            appState = {};
        }

        // Element DOM
        const menuScreen = document.getElementById('menu-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const scoreDisplay = document.getElementById('score-display');
        const currentScoreEl = document.getElementById('current-score');
        const totalAnsweredEl = document.getElementById('total-answered');
        
        const questionCounterEl = document.getElementById('question-counter');
        const passageTextEl = document.getElementById('passage-text');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        
        const explanationContainerEl = document.getElementById('explanation-container');
        const explanationTextEl = document.getElementById('explanation-text');
        
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        // Update UI Menu untuk menampilkan status cache
        function updateMenuUI() {
            const categories = ['skolastik', 'matematika', 'bahasa_indonesia', 'bahasa_inggris'];
            categories.forEach(cat => {
                const subtitle = document.getElementById(`desc-${cat}`);
                if (!subtitle) return;
                
                if (appState[cat] && appState[cat].finished) {
                    const percentage = Math.round((appState[cat].score / questionsData[cat].length) * 100);
                    subtitle.textContent = `Selesai (Skor: ${percentage}%) - Klik untuk Ulang`;
                    subtitle.className = "text-sm text-green-600 font-semibold mt-1";
                } else if (appState[cat] && appState[cat].answeredQuestions > 0) {
                    subtitle.textContent = `Lanjut Soal ${appState[cat].currentIndex + 1} / ${questionsData[cat].length}`;
                    subtitle.className = "text-sm text-orange-500 font-semibold mt-1";
                } else {
                    subtitle.textContent = "25 Soal";
                    subtitle.className = "text-sm text-gray-500 mt-1";
                }
            });
        }

        // Inisialisasi UI pertama kali
        updateMenuUI();

        // Fungsi menyimpan state ke local storage
        function saveState() {
            localStorage.setItem('penmabaState', JSON.stringify(appState));
        }

        // Fungsi untuk memulai tes
        function startTest(category) {
            currentCategory = category;

            // Inisialisasi state jika belum ada atau tes sebelumnya sudah selesai
            if (!appState[category] || appState[category].finished) {
                appState[category] = {
                    currentIndex: 0,
                    score: 0,
                    answeredQuestions: 0,
                    answers: {}, // Menyimpan jawaban dengan format { indexSoal: indexPilihan }
                    finished: false
                };
            }

            // Load data dari state cache
            currentQuestionIndex = appState[category].currentIndex;
            score = appState[category].score;
            answeredQuestions = appState[category].answeredQuestions;
            
            saveState();
            
            // Sembunyikan menu, tampilkan quiz
            menuScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            scoreDisplay.classList.remove('hidden');
            
            updateScoreDisplay();
            loadQuestion();
        }

        // Fungsi untuk merender soal ke layar
        function loadQuestion() {
            isQuestionAnswered = false;
            explanationContainerEl.classList.add('hidden');
            nextBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');
            
            const currentQuestions = questionsData[currentCategory];
            const qData = currentQuestions[currentQuestionIndex];
            
            questionCounterEl.textContent = `Soal ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
            
            // Tampilkan passage/bacaan jika ada
            if (qData.passage) {
                passageTextEl.textContent = qData.passage;
                passageTextEl.classList.remove('hidden');
            } else {
                passageTextEl.classList.add('hidden');
            }
            
            questionTextEl.textContent = qData.q;
            
            // Generate Opsi Jawaban
            optionsContainerEl.innerHTML = '';
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 border rounded-lg hover:bg-gray-50 transition-colors focus:outline-none';
                btn.innerHTML = `<span class="font-medium mr-2">${String.fromCharCode(65 + index)}.</span> ${opt.substring(3)}`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainerEl.appendChild(btn);
            });
            
            // Scroll ke atas dengan halus
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Jika soal ini sudah pernah dijawab (terekam di cache), pulihkan tampilannya
            if (appState[currentCategory].answers[currentQuestionIndex] !== undefined) {
                restoreAnsweredState(appState[currentCategory].answers[currentQuestionIndex]);
            }
        }

        // Fungsi untuk mengembalikan tampilan soal yang sudah dijawab jika di-reload
        function restoreAnsweredState(selectedIndex) {
            isQuestionAnswered = true;
            const currentQuestions = questionsData[currentCategory];
            const qData = currentQuestions[currentQuestionIndex];
            const correctIndex = qData.answer;
            const optionButtons = optionsContainerEl.children;

            for (let i = 0; i < optionButtons.length; i++) {
                optionButtons[i].classList.add('disabled-option');
                if (i === correctIndex) {
                    optionButtons[i].classList.add('correct-answer');
                    if (!optionButtons[i].innerHTML.includes('✓ Benar')) {
                        optionButtons[i].innerHTML += ' <span class="float-right text-green-700">✓ Benar</span>';
                    }
                }
            }

            if (selectedIndex !== correctIndex) {
                const selectedBtn = optionButtons[selectedIndex];
                selectedBtn.classList.add('wrong-answer');
                if (!selectedBtn.innerHTML.includes('✗ Salah')) {
                    selectedBtn.innerHTML += ' <span class="float-right text-red-700">✗ Salah</span>';
                }
            }

            explanationTextEl.textContent = qData.explanation;
            explanationContainerEl.classList.remove('hidden');

            if (currentQuestionIndex < currentQuestions.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.remove('hidden');
            }
        }

        // Fungsi saat opsi dipilih
        function selectOption(selectedIndex, selectedBtn) {
            if (isQuestionAnswered) return; // Cegah klik ganda
            
            isQuestionAnswered = true;
            answeredQuestions++;
            appState[currentCategory].answeredQuestions = answeredQuestions;
            
            const currentQuestions = questionsData[currentCategory];
            const qData = currentQuestions[currentQuestionIndex];
            const correctIndex = qData.answer;
            
            const optionButtons = optionsContainerEl.children;
            
            // Disable semua tombol
            for (let i = 0; i < optionButtons.length; i++) {
                optionButtons[i].classList.add('disabled-option');
                
                // Warnai jawaban yang benar
                if (i === correctIndex) {
                    optionButtons[i].classList.add('correct-answer');
                    // Ganti teks jadi tebal
                    optionButtons[i].innerHTML = optionButtons[i].innerHTML + ' <span class="float-right text-green-700">✓ Benar</span>';
                }
            }
            
            // Cek apakah jawaban user benar atau salah
            if (selectedIndex === correctIndex) {
                score++;
                appState[currentCategory].score = score;
            } else {
                selectedBtn.classList.add('wrong-answer');
                selectedBtn.innerHTML = selectedBtn.innerHTML + ' <span class="float-right text-red-700">✗ Salah</span>';
            }

            // Simpan jawaban ke cache
            appState[currentCategory].answers[currentQuestionIndex] = selectedIndex;
            saveState();
            
            // Tampilkan pembahasan
            explanationTextEl.textContent = qData.explanation;
            explanationContainerEl.classList.remove('hidden');
            
            // Tampilkan tombol navigasi yang sesuai
            if (currentQuestionIndex < currentQuestions.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.remove('hidden');
            }
            
            updateScoreDisplay();
        }

        // Fungsi pindah ke soal selanjutnya
        function nextQuestion() {
            currentQuestionIndex++;
            appState[currentCategory].currentIndex = currentQuestionIndex;
            saveState();
            loadQuestion();
        }

        // Fungsi menyelesaikan tes dan menampilkan skor
        function finishTest() {
            appState[currentCategory].finished = true;
            saveState();

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            scoreDisplay.classList.add('hidden');
            
            const totalQuestions = questionsData[currentCategory].length;
            const percentage = Math.round((score / totalQuestions) * 100);
            
            let categoryName = '';
            switch(currentCategory) {
                case 'skolastik': categoryName = 'Tes Penalaran Skolastik'; break;
                case 'matematika': categoryName = 'Penalaran Matematika'; break;
                case 'bahasa_indonesia': categoryName = 'Literasi Bahasa Indonesia'; break;
                case 'bahasa_inggris': categoryName = 'Literasi Bahasa Inggris'; break;
            }
            
            document.getElementById('result-category').textContent = `Kategori: ${categoryName}`;
            document.getElementById('final-score').textContent = `${percentage}%`;
            document.getElementById('correct-count').textContent = score;
            document.getElementById('wrong-count').textContent = totalQuestions - score;
            
            // Animasi Lingkaran Skor
            const circle = document.getElementById('score-circle');
            const circumference = 100; // dari dasharray
            const offset = circumference - (percentage / 100) * circumference;
            circle.style.strokeDashoffset = offset;
            
            // Ganti warna berdasarkan skor
            if(percentage >= 80) circle.classList.replace('text-green-500', 'text-green-500');
            else if(percentage >= 60) circle.classList.replace('text-green-500', 'text-yellow-400');
            else circle.classList.replace('text-green-500', 'text-red-500');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Fungsi kembali ke menu utama
        function backToMenu() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            scoreDisplay.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            
            updateMenuUI();

            // Reset lingkaran skor
            const circle = document.getElementById('score-circle');
            circle.style.strokeDashoffset = 0;
            circle.className = "text-green-500 stroke-current";
        }

        // Update teks skor di header
        function updateScoreDisplay() {
            currentScoreEl.textContent = score;
            totalAnsweredEl.textContent = answeredQuestions;
        }
    </script>
</body>
</html>
